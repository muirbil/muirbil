name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Stats + top languages ----------
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Project pin cards ----------
      - name: Pin flan
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=flan&theme=tokyonight&hide_border=true&description_lines_count=3
          path: profile/pin-flan.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Komimi
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Komimi&theme=tokyonight&hide_border=true&description_lines_count=3
          path: profile/pin-komimi.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin channeling-overhaul
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=channeling-overhaul&theme=tokyonight&hide_border=true&description_lines_count=3
          path: profile/pin-channeling-overhaul.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin flan-packages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=flan-packages&theme=tokyonight&hide_border=true&description_lines_count=3
          path: profile/pin-flan-packages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Make all pin cards the same height ----------
      - name: Equalize pin card heights
        run: |
          python3 - <<'PY'
          import glob, re
          files = sorted(glob.glob("profile/pin-*.svg"))
          data = {f: open(f, encoding="utf-8").read() for f in files}
          def svg_tag(s):
              a = s.index("<svg"); b = s.index(">", a)
              return a, b
          def height(s):
              a, b = svg_tag(s)
              return float(re.search(r'\bheight="([\d.]+)"', s[a:b]).group(1))
          H = max(height(s) for s in data.values())
          Hs = f"{H:g}"
          for f, s in data.items():
              a, b = svg_tag(s)
              tag = s[a:b]
              tag = re.sub(r'\bheight="[\d.]+"', f'height="{Hs}"', tag, count=1)
              tag = re.sub(r'viewBox="([\d.]+) ([\d.]+) ([\d.]+) [\d.]+"',
                           lambda m: f'viewBox="{m.group(1)} {m.group(2)} {m.group(3)} {Hs}"', tag, count=1)
              s = s[:a] + tag + s[b:]
              # background rect, in case its height is absolute rather than "99%"
              s = re.sub(r'(<rect[^>]*data-testid="card-bg"[^>]*?\bheight=")([\d.]+)(")',
                         lambda m: f'{m.group(1)}{H - 1:g}{m.group(3)}', s)
              open(f, "w", encoding="utf-8").write(s)
          print("pin cards height ->", Hs)
          PY

      # ---------- Commit ----------
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
